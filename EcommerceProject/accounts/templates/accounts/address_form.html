{% extends "base.html" %}
{% block title %}Add Address{% endblock %}
{% block content %}
<h4>Add Address</h4>
<form method="post" class="card p-4 bg-white" style="max-width:500px;">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
    </div>
    {% endfor %}
    <button class="btn btn-primary" type="submit">Save Address</button>
</form>
{% endblock %}
